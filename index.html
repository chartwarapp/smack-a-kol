<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Smack-a-KOL — Slap Fight Arena</title>
<meta name="description" content="Smack-a-KOL: challenge fighters to timing-based slap duels and wager SOL on the Solana blockchain." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Smack-a-KOL — Slap Fight Arena" />
<meta property="og:description" content="Challenge fighters to slap duels. Winner takes the SOL. 🥊" />
<meta property="og:image" content="https://smackakol.com/assets/logo-hero.jpg" />
<meta property="og:url" content="https://smackakol.com/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Smack-a-KOL — Slap Fight Arena" />
<meta name="twitter:description" content="Challenge fighters to slap duels. Winner takes the SOL. 🥊" />
<meta name="twitter:image" content="https://smackakol.com/assets/logo-hero.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1a0b2e; }
  body { font-family: 'Lilita One', system-ui, sans-serif; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #portal { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Hand mascot fly-in */
  #hand {
    position: absolute; left: 50%; top: 52%;
    width: min(72vw, 420px);
    transform: translate(-50%, -50%) scale(0);
    filter: drop-shadow(0 0 30px #39ff88aa);
    opacity: 0;
  }
  #hand.fly {
    animation: handFly 1.1s cubic-bezier(.2,1.4,.3,1) forwards;
  }
  @keyframes handFly {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0) rotate(-30deg); }
    60% { opacity: 1; transform: translate(-50%,-50%) scale(1.25) rotate(8deg); }
    80% { transform: translate(-50%,-50%) scale(0.95) rotate(-4deg); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0); }
  }
  /* Idle wobble after landing */
  #hand.settled { animation: handWobble 3s ease-in-out infinite; opacity: 1; }
  @keyframes handWobble {
    0%,100% { transform: translate(-50%,-50%) scale(1) rotate(-2deg); }
    50% { transform: translate(-50%,-52%) scale(1.03) rotate(2deg); }
  }

  /* SMACK! comic burst */
  #smack {
    position: absolute; left: 50%; top: 30%;
    transform: translate(-50%,-50%) scale(0) rotate(-12deg);
    font-size: clamp(60px, 18vw, 140px);
    color: #ffd23f;
    -webkit-text-stroke: 3px #1a0b2e;
    text-shadow: 6px 6px 0 #1a0b2e, 0 0 40px #ff6b35;
    opacity: 0; white-space: nowrap;
  }
  #smack.pop { animation: smackPop 0.9s cubic-bezier(.2,1.6,.3,1) forwards; }
  @keyframes smackPop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0) rotate(-12deg); }
    40% { opacity: 1; transform: translate(-50%,-50%) scale(1.3) rotate(4deg); }
    70% { transform: translate(-50%,-50%) scale(0.95) rotate(-2deg); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-6deg); }
  }
  #smack.fade { animation: smackFade 0.5s ease-in forwards; }
  @keyframes smackFade { to { opacity: 0; transform: translate(-50%,-50%) scale(1.6); } }

  /* Logo text slam */
  #logo-text {
    position: absolute; left: 50%; top: 16%;
    width: min(92vw, 640px);
    transform: translate(-50%, -120vh);
    filter: drop-shadow(0 6px 0 #1a0b2e);
    opacity: 0;
  }
  #logo-text.slam { animation: logoSlam 0.7s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes logoSlam {
    0% { opacity: 1; transform: translate(-50%,-120vh); }
    60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    80% { transform: translate(-50%,-50%) scale(0.96); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }

  /* Screen shake */
  #stage.shake { animation: shake 0.5s linear; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-14px,8px) rotate(-1deg); }
    40% { transform: translate(12px,-10px) rotate(1deg); }
    60% { transform: translate(-10px,-6px); }
    80% { transform: translate(8px,10px); }
  }

  /* Settle: full logo backdrop */
  #hero {
    position: absolute; inset: 0;
    background: url('assets/logo-hero.jpg') center / cover no-repeat;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #hero.show { opacity: 1; }
  #intro-els.hide { opacity: 0; transition: opacity 0.8s ease; }

  /* Enter overlay */
  .landing-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    padding: 0 24px calc(48px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,4,24,.78) 0%, rgba(10,4,24,0) 42%);
    pointer-events: none;
    opacity: 0; transition: opacity 0.8s ease;
  }
  .landing-overlay.show { opacity: 1; }
  #enter-btn {
    pointer-events: auto;
    font-family: 'Lilita One', system-ui, sans-serif;
    font-size: clamp(24px, 6vw, 34px);
    letter-spacing: 2px;
    color: #1a0b2e;
    background: #39ff88;
    border: 4px solid #1a0b2e;
    border-radius: 20px;
    box-shadow: 0 8px 0 #1a0b2e, 0 0 40px #39ff8866;
    padding: 18px 54px;
    cursor: pointer;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #enter-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #1a0b2e; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .landing-tag {
    margin-top: 14px; color: #fff; opacity: .85;
    font-size: 14px; letter-spacing: 3px;
    text-shadow: 0 2px 8px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="portal"></canvas>
  <div id="intro-els">
    <img id="hand" src="assets/hand-mascot.png" alt="" />
    <div id="smack">SMACK!</div>
    <img id="logo-text" src="assets/logo-text.png" alt="" />
  </div>
  <div id="hero"></div>
</div>

<div class="landing-overlay" id="overlay">
  <button id="enter-btn">🥊 ENTER THE RING</button>
  <div class="landing-tag">SLAP · WAGER · WIN SOL</div>
</div>

<script>
(function () {
  // ---- Portal vortex canvas ----
  var cv = document.getElementById('portal'), ctx = cv.getContext('2d');
  var W, H, parts = [], t = 0;
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  var COLORS = ['#7b2ff7', '#39ff88', '#ffd23f', '#ff6bd6', '#4a1d96'];
  for (var i = 0; i < 130; i++) {
    parts.push({
      a: Math.random() * Math.PI * 2,
      r: 40 + Math.random() * Math.max(W, H) * 0.7,
      sp: 0.008 + Math.random() * 0.03,
      sz: 2 + Math.random() * 7,
      c: COLORS[i % COLORS.length],
      wob: Math.random() * Math.PI * 2
    });
  }
  var cx, cy;
  (function draw() {
    t += 0.016;
    cx = W / 2; cy = H * 0.46;
    ctx.fillStyle = '#1a0b2e';
    ctx.fillRect(0, 0, W, H);
    // radial glow
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);
    g.addColorStop(0, '#3d1663');
    g.addColorStop(0.5, '#241040');
    g.addColorStop(1, '#1a0b2e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // spiral particles
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.a += p.sp * (1 + 0.6 * Math.sin(t * 2 + p.wob));
      p.r -= 0.55; // spiral inward
      if (p.r < 24) { p.r = 60 + Math.random() * Math.max(W, H) * 0.65; p.a = Math.random() * Math.PI * 2; }
      var x = cx + Math.cos(p.a) * p.r, y = cy + Math.sin(p.a) * p.r * 0.82;
      ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t * 3 + p.wob));
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(x, y, p.sz * (1 - p.r / (Math.max(W, H) * 0.8)), 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  })();

  // ---- Intro timeline ----
  var stage = document.getElementById('stage');
  var hand = document.getElementById('hand');
  var smack = document.getElementById('smack');
  var logoText = document.getElementById('logo-text');

  setTimeout(function () { hand.classList.add('fly'); }, 900);

  setTimeout(function () {
    smack.classList.add('pop');
    stage.classList.remove('shake'); void stage.offsetWidth;
    stage.classList.add('shake');
    // comedic hand recoil on impact
    hand.classList.remove('fly'); hand.classList.add('settled');
  }, 2100);

  setTimeout(function () {
    smack.classList.add('fade');
    logoText.classList.add('slam');
    stage.classList.remove('shake'); void stage.offsetWidth;
    stage.classList.add('shake');
  }, 3000);

  setTimeout(function () {
    document.getElementById('intro-els').classList.add('hide');
    document.getElementById('hero').classList.add('show');
    document.getElementById('overlay').classList.add('show');
  }, 4300);

  // ---- Enter ----
  document.getElementById('enter-btn').addEventListener('click', function () {
    location.href = 'play.html' + location.search;
  });
})();
</script>
</body>
</html>
