<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Smack-a-KOL — Slap Fight Arena</title>
<meta name="description" content="Smack-a-KOL: challenge fighters to timing-based slap duels and wager SOL on the Solana blockchain." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Smack-a-KOL — Slap Fight Arena" />
<meta property="og:description" content="Challenge fighters to slap duels. Winner takes the SOL. 🥊" />
<meta property="og:image" content="https://smackakol.com/assets/logo-hero.jpg" />
<meta property="og:url" content="https://smackakol.com/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Smack-a-KOL — Slap Fight Arena" />
<meta name="twitter:description" content="Challenge fighters to slap duels. Winner takes the SOL. 🥊" />
<meta name="twitter:image" content="https://smackakol.com/assets/logo-hero.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1a0b2e; }
  body { font-family: 'Lilita One', system-ui, sans-serif; }

  #intro-video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .landing-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    padding: 0 24px calc(52px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,4,24,.72) 0%, rgba(10,4,24,0) 38%);
    pointer-events: none;
    opacity: 0; animation: fadeIn 1s ease 0.6s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  #enter-btn {
    pointer-events: auto;
    font-family: 'Lilita One', system-ui, sans-serif;
    font-size: clamp(24px, 6vw, 34px);
    letter-spacing: 2px;
    color: #1a0b2e;
    background: linear-gradient(180deg, #4dff9d, #39ff88);
    border: 4px solid #1a0b2e;
    border-radius: 20px;
    box-shadow: 0 8px 0 #1a0b2e, 0 0 44px rgba(57,255,136,.4);
    padding: 18px 58px;
    cursor: pointer;
    animation: pulse 1.8s ease-in-out infinite;
  }
  #enter-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #1a0b2e; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  .landing-tag {
    margin-top: 14px; color: #fff; opacity: .85;
    font-size: 14px; letter-spacing: 4px;
    text-shadow: 0 2px 10px #000;
  }
</style>
</head>
<body>
  <video id="intro-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/landing-intro.mp4" type="video/mp4" />
  </video>

  <div class="landing-overlay">
    <button id="enter-btn">🥊 ENTER THE RING</button>
    <div class="landing-tag">SLAP · WAGER · WIN SOL</div>
  </div>

<script>
  // Force muted autoplay (iOS Safari needs the JS nudge)
  (function () {
    var v = document.getElementById('intro-video');
    v.muted = true;
    v.setAttribute('muted', '');
    var tryPlay = function () { v.play().catch(function () {}); };
    tryPlay();
    // fallback: kick playback on first touch if the browser blocked it
    var kick = function () { tryPlay(); };
    document.addEventListener('touchstart', kick, { passive: true, once: true });
    document.addEventListener('click', kick, { once: true });
  })();

  document.getElementById('enter-btn').addEventListener('click', function () {
    location.href = 'play.html' + location.search;
  });
</script>
</body>
</html>
