<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Smack-a-KOL — Slap Fight Arena</title>
<meta name="description" content="Smack-a-KOL: challenge fighters to timing-based slap duels and wager SOL on the Solana blockchain." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Smack-a-KOL — Slap Fight Arena" />
<meta property="og:description" content="Challenge fighters to slap duels. Winner takes the SOL. 🥊" />
<meta property="og:image" content="https://smackakol.com/assets/logo-hero.jpg" />
<meta property="og:url" content="https://smackakol.com/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Smack-a-KOL — Slap Fight Arena" />
<meta name="twitter:description" content="Challenge fighters to slap duels. Winner takes the SOL. 🥊" />
<meta name="twitter:image" content="https://smackakol.com/assets/logo-hero.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Lilita One', system-ui, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 10%, #3d1663 0%, #241040 45%, #120826 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100dvh;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
  }

  #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .hero {
    position: relative;
    width: min(94vw, 560px);
    opacity: 0;
    animation: heroIn 1.1s cubic-bezier(.2,.9,.25,1) 0.15s forwards;
    filter: drop-shadow(0 18px 50px rgba(123,47,247,.45));
  }
  @keyframes heroIn {
    from { opacity: 0; transform: scale(.93) translateY(14px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .hero img {
    display: block; width: 100%; height: auto;
    border-radius: 22px;
    /* feather the edges so the art melts into the background */
    -webkit-mask-image: radial-gradient(115% 115% at 50% 50%, #000 62%, transparent 98%);
    mask-image: radial-gradient(115% 115% at 50% 50%, #000 62%, transparent 98%);
  }
  /* gentle idle float */
  .hero.float { animation: heroFloat 5s ease-in-out infinite; }
  @keyframes heroFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  /* premium shine sweep */
  .hero::after {
    content: ''; position: absolute; inset: 0; border-radius: 22px;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.22) 50%, transparent 60%);
    background-size: 280% 100%; background-position: 130% 0;
    -webkit-mask-image: radial-gradient(115% 115% at 50% 50%, #000 62%, transparent 98%);
    mask-image: radial-gradient(115% 115% at 50% 50%, #000 62%, transparent 98%);
    animation: shine 6s ease-in-out 2s infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0% { background-position: 130% 0; }
    35%,100% { background-position: -40% 0; }
  }

  .cta {
    margin-top: 34px;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; animation: heroIn 0.9s ease 1s forwards;
  }
  #enter-btn {
    font-family: 'Lilita One', system-ui, sans-serif;
    font-size: clamp(24px, 6vw, 32px);
    letter-spacing: 2px;
    color: #1a0b2e;
    background: linear-gradient(180deg, #4dff9d, #39ff88);
    border: 4px solid #1a0b2e;
    border-radius: 20px;
    box-shadow: 0 8px 0 #1a0b2e, 0 0 44px rgba(57,255,136,.35);
    padding: 18px 58px;
    cursor: pointer;
  }
  #enter-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #1a0b2e; }
  .landing-tag {
    margin-top: 16px; color: #fff; opacity: .8;
    font-size: 13px; letter-spacing: 4px;
    text-shadow: 0 2px 10px #000;
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="hero" id="hero">
  <img src="assets/logo-hero.jpg" alt="Smack-a-KOL" />
</div>

<div class="cta">
  <button id="enter-btn">🥊 ENTER THE RING</button>
  <div class="landing-tag">SLAP · WAGER · WIN SOL</div>
</div>

<script>
(function () {
  // subtle ambient particles in brand colors
  var cv = document.getElementById('bg-canvas'), ctx = cv.getContext('2d');
  var W, H, ps = [];
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  var COLORS = ['#7b2ff7', '#39ff88', '#ffd23f'];
  for (var i = 0; i < 45; i++) {
    ps.push({
      x: Math.random(), y: Math.random(),
      r: 1 + Math.random() * 2.6,
      c: COLORS[i % 3],
      vx: (Math.random() - .5) * 0.0006,
      vy: -0.0004 - Math.random() * 0.0011,
      ph: Math.random() * 6.28
    });
  }
  var t = 0;
  (function draw() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
      if (p.x < -0.05) p.x = 1.05; if (p.x > 1.05) p.x = -0.05;
      ctx.globalAlpha = 0.14 + 0.12 * Math.sin(t * 1.4 + p.ph);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  })();

  // start idle float after entrance
  var hero = document.getElementById('hero');
  hero.addEventListener('animationend', function h(e) {
    if (e.animationName === 'heroIn') { hero.classList.add('float'); hero.removeEventListener('animationend', h); }
  });

  document.getElementById('enter-btn').addEventListener('click', function () {
    location.href = 'play.html' + location.search;
  });
})();
</script>
</body>
</html>
