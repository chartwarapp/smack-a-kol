<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>X feed test (temporary diagnostic)</title>
</head>
<body style="background:#111;color:#fff;font-family:sans-serif;margin:16px">
<h2 id="status">waiting for widgets.js…</h2>
<p>Auto-scan anchor, @smackakol (same markup as play.html):</p>
<div id="auto"><a class="twitter-timeline" data-height="420" data-theme="dark" data-chrome="noheader nofooter noborders transparent" href="https://twitter.com/smackakol?ref_src=twsrc%5Etfw">Posts by @smackakol</a></div>
<p>Programmatic timeline, @smackakol:</p>
<div id="prog"></div>
<p>Auto-scan anchor, @XDevelopers (control account):</p>
<div id="auto2"><a class="twitter-timeline" data-height="420" data-theme="dark" data-chrome="noheader nofooter noborders transparent" href="https://twitter.com/XDevelopers">Tweets by XDevelopers</a></div>
<p>Programmatic timeline, @XDevelopers (control account):</p>
<div id="prog2"></div>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
<script>
(function () {
  var t0 = Date.now();
  var tried = false;
  function secs() { return Math.round((Date.now() - t0) / 1000) + 's'; }
  function set(msg) { document.getElementById('status').textContent = msg; }
  function info(id) {
    var f = document.querySelector('#' + id + ' iframe');
    if (!f) return id + ':none';
    var src = (f.getAttribute('src') || '').slice(0, 120);
    return id + ':h=' + f.offsetHeight + ' src=' + src;
  }
  function counts() {
    return 'twttr=' + (!!window.twttr) + ' | ' +
      info('auto') + ' | ' + info('prog') + ' | ' + info('auto2') + ' | ' + info('prog2');
  }
  function tick() {
    set(secs() + ' ' + counts());
    if (window.twttr && !tried) {
      tried = true;
      [{ el: 'prog', name: 'smackakol' }, { el: 'prog2', name: 'XDevelopers' }].forEach(function (c) {
        try {
          window.twttr.widgets.createTimeline(
            { sourceType: 'profile', screenName: c.name },
            document.getElementById(c.el),
            { theme: 'dark', height: 420, chrome: 'noheader nofooter noborders transparent' }
          ).catch(function (e) {
            set(secs() + ' createTimeline(' + c.name + ') FAILED: ' + e + ' — ' + counts());
          });
        } catch (e) {
          set(secs() + ' createTimeline(' + c.name + ') threw: ' + e + ' — ' + counts());
        }
      });
    }
  }
  var iv = setInterval(tick, 1000);
  setTimeout(function () { clearInterval(iv); tick(); }, 25000);
})();
</script>
</body>
</html>
