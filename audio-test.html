<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smack King audio test (temp)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #12031f; color: #fff; margin: 0; padding: 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #ccc; font-size: 14px; line-height: 1.5; }
  button { display: block; width: 100%; padding: 16px; margin: 10px 0; font-size: 18px; font-weight: 700;
    border: 0; border-radius: 12px; background: #ffd23f; color: #12031f; }
  button:disabled { opacity: .4; }
  .bank { border: 1px solid #444; border-radius: 12px; padding: 12px; margin: 12px 0; }
  .bank h2 { font-size: 17px; margin: 0 0 4px; }
  .st { font-size: 13px; color: #aaa; min-height: 18px; }
  .ok { color: #39ff88; } .bad { color: #ff3b5c; }
  #log { font-size: 13px; color: #ccc; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>Smack King audio test</h1>
<p>Temp diagnostic page. Tap UNLOCK, wait for the banks to load, then tap each PLAY button and note which ones you actually hear.</p>
<button id="unlock">🔊 UNLOCK AUDIO</button>
<div class="st" id="ctxst">Audio: not started</div>
<div id="banks"></div>
<div id="log"></div>
<script>
const BANKS = {
  MAIN: Array.from({length: 24}, (_, i) => 'assets/sfx/smackking-' + String(i + 1).padStart(2, '0') + '.mp3'),
  RED: ['01','03','04','05','06','07'].map(n => 'assets/sfx/smackking-red-' + n + '.mp3'),
  MISS: ['01','02','03','04','05','06'].map(n => 'assets/sfx/smackking-miss-' + n + '.mp3'),
  YELLOW: ['01','02','03','04'].map(n => 'assets/sfx/smackking-yellow-' + n + '.mp3'),
  OPENING: ['01','02','03','04','05','06'].map(n => 'assets/sfx/smackking-open-' + n + '.mp3'),
};
let ctx = null, master = null;
const bufs = {}; // file -> AudioBuffer
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; };
const banksEl = document.getElementById('banks');
Object.keys(BANKS).forEach(name => {
  const div = document.createElement('div');
  div.className = 'bank';
  div.innerHTML = '<h2>' + name + '</h2><div class="st" id="st-' + name + '">not loaded</div><button id="play-' + name + '" disabled>▶ PLAY ' + name + ' LINE</button>';
  banksEl.appendChild(div);
  document.getElementById('play-' + name).addEventListener('click', () => playBank(name));
});
function setSt(name, html) { document.getElementById('st-' + name).innerHTML = html; }
document.getElementById('unlock').addEventListener('click', async () => {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { log('No AudioContext on this device'); return; }
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
  if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
  document.getElementById('ctxst').textContent = 'Audio: state=' + ctx.state + ' — loading banks…';
  log('ctx.state=' + ctx.state);
  await Promise.all(Object.keys(BANKS).map(async (name) => {
    let ok = 0, fail = 0;
    await Promise.all(BANKS[name].map(async (f) => {
      try {
        const r = await fetch(f);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const ab = await r.arrayBuffer();
        bufs[f] = await ctx.decodeAudioData(ab);
        ok++;
      } catch (e) { fail++; log(name + ' FAIL ' + f + ': ' + e.message); }
    }));
    setSt(name, 'loaded <span class="' + (fail ? 'bad' : 'ok') + '">' + ok + '/' + BANKS[name].length + '</span>' + (fail ? ' (' + fail + ' failed)' : ''));
    document.getElementById('play-' + name).disabled = ok === 0;
  }));
  document.getElementById('ctxst').textContent = 'Audio: state=' + ctx.state + ' — all banks attempted.';
});
function playBank(name) {
  const ready = BANKS[name].filter(f => bufs[f]);
  if (!ready.length) { log(name + ': nothing decoded, cannot play'); return; }
  const f = ready[Math.floor(Math.random() * ready.length)];
  const src = ctx.createBufferSource(); src.buffer = bufs[f];
  const g = ctx.createGain(); g.gain.value = 0.8; src.connect(g); g.connect(master);
  src.onended = () => log(name + ' ended: ' + f);
  src.start();
  log(name + ' playing: ' + f + ' (' + bufs[f].duration.toFixed(2) + 's)');
}
</script>
</body>
</html>
